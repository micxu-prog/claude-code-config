apiVersion: v1
kind: Pod
metadata:
  name: kata-counter
spec:
  runtimeClassName: kata
  nodeSelector:
    kubernetes.io/hostname: aks-nodepool1-23826427-vmss000000
  containers:
    - name: counter
      image: docker.io/library/python:3.12-slim
      command: ["python", "-c"]
      args:
        - |
          import http.server, socketserver
          c = [0]
          class H(http.server.BaseHTTPRequestHandler):
              def do_GET(self):
                  self.send_response(200); self.end_headers()
                  self.wfile.write(f"counter={c[0]}\n".encode())
              def do_POST(self):
                  c[0] += 1
                  self.send_response(200); self.end_headers()
                  self.wfile.write(f"counter={c[0]}\n".encode())
              def log_message(self, *a, **k): pass
          socketserver.TCPServer.allow_reuse_address = True
          socketserver.TCPServer(("0.0.0.0", 9999), H).serve_forever()
      ports:
        - containerPort: 9999
