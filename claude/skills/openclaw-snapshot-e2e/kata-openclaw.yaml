apiVersion: v1
kind: ConfigMap
metadata:
  name: openclaw-config
data:
  openclaw.json: |
    {
      "models": {
        "providers": {
          "copilot": {
            "baseUrl": "https://0lj4k0wp-4000.usw2.devtunnels.ms/v1",
            "apiKey": "sk-",
            "api": "openai-completions",
            "models": [
              { "id": "claude-sonnet-4.6", "name": "Claude Sonnet 4.6 (Copilot)", "contextWindow": 200000, "maxTokens": 64000 },
              { "id": "claude-opus-4.6", "name": "Claude Opus 4.6 (Copilot)", "contextWindow": 200000, "maxTokens": 64000 },
              { "id": "claude-haiku-4.5", "name": "Claude Haiku 4.5 (Copilot)", "contextWindow": 200000, "maxTokens": 64000 }
            ]
          }
        }
      },
      "agents": {
        "defaults": {
          "model": { "primary": "copilot/claude-haiku-4.5" },
          "models": { "copilot/claude-haiku-4.5": {} }
        }
      },
      "gateway": {
        "controlUi": {
          "dangerouslyAllowHostHeaderOriginFallback": true,
          "dangerouslyDisableDeviceAuth": true,
          "allowedOrigins": [
            "http://127.0.0.1:38789",
            "http://localhost:38789"
          ]
        }
      }
    }
---
apiVersion: v1
kind: Pod
metadata:
  name: kata-openclaw
  labels:
    sandbox: openclaw-sandbox
spec:
  runtimeClassName: kata
  nodeSelector:
    kubernetes.io/hostname: aks-nodepool1-23826427-vmss000000
  automountServiceAccountToken: false
  securityContext:
    runAsUser: 1000
    runAsGroup: 1000
    fsGroup: 1000
  containers:
    - name: openclaw
      image: ghcr.io/openclaw/openclaw:2026.3.23
      imagePullPolicy: IfNotPresent
      securityContext:
        allowPrivilegeEscalation: false
        readOnlyRootFilesystem: false
        runAsNonRoot: true
        capabilities:
          drop:
            - ALL
      env:
        - name: OPENCLAW_GATEWAY_TOKEN
          value: "dummy-token-for-sandbox"
        - name: OPENCLAW_CONFIG_PATH
          value: "/etc/openclaw/openclaw.json"
      command:
        - node
        - dist/index.js
        - gateway
        - --bind=lan
        - --port
        - "18789"
        - --allow-unconfigured
        - --verbose
      ports:
        - containerPort: 18789
        - containerPort: 18790
      volumeMounts:
        - mountPath: /home/node/.openclaw/workspace
          name: workspaces-emptydir
        - mountPath: /home/node/.openclaw
          name: config-volume
        - mountPath: /etc/openclaw
          name: cm-volume
  volumes:
    - name: workspaces-emptydir
      emptyDir: {}
    - name: config-volume
      emptyDir: {}
    - name: cm-volume
      configMap:
        name: openclaw-config
